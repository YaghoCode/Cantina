<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/login.css">
    <title>Cantina PJ - Login</title>
</head>
<body>

    <!-- NAV -->
<header>
    <nav class="navbar">
              <div class="nav-links">
                    <ul>
                        <li>
                            <h1>
                                <a href="">Faça o login para continuar</a>
                            </h1>
                        </li>
                    </ul>
               </div>
        </nav>
</header>

    <!-- MAIN -->
<main class="main">

<p class="main-p">Entre em sua conta ou cadastre seu e-mail</p>

<div class="login-conteiner">
  <div class="login-header">
    <span class="icon-left">🔍</span>
    <h2>Entre</h2>
    <span class="icon-right">✕</span>
  </div>

  <div class="divisao"></div>

  <form class="login-form" action="#" method="post">
    <input type="email" placeholder="E-mail" required>
    <input type="password" placeholder="Senha" required>
    <button type="submit">Entrar</button>
  </form>

  <p class="login-footer">
    Não tem uma conta? <a href="/subpages/register.html">Cadastre-se</a>
  </p>
</div>


<!-- Circulos espalhados -->
  <div class="decor-circle circle1"></div>
  <div class="decor-circle circle2"></div>

</main>




</body>
</html>
